<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>No connection</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#142237;color:#fff;font:16px -apple-system,"Segoe UI",system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
.c{max-width:380px}h1{font-size:21px;margin:0 0 10px}p{opacity:.85;line-height:1.5;margin:0 0 22px}
button{background:#e5ac4c;color:#142237;border:0;border-radius:10px;padding:12px 24px;font-weight:600;font-size:16px;cursor:pointer}</style></head>
<body><div class="c"><h1>No internet connection</h1>
<p id="m">This app needs the internet to reach your company's data. Check your connection, then try again.</p>
<button id="b">Try again</button></div>
<script>
const q = new URLSearchParams(location.search);
if (q.get('name')) document.title = q.get('name') + ' — no connection';
document.getElementById('b').onclick = () => window.BVQSSDesktop && window.BVQSSDesktop.retry(q.get('to'));
window.addEventListener('online', () => window.BVQSSDesktop && window.BVQSSDesktop.retry(q.get('to')));
</script></body></html>
